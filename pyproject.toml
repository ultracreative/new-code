[project]
name = "newcode"
version = "1.0.0"
description = "New Code — a machine-native language for human–AI collaboration"
authors = [{ name = "Daniel Rodríguez Suárez" }]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }

[project.scripts]
newcode = "newcode.repl:main"
newcode-lsp = "newcode.lsp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["newcode*"]
